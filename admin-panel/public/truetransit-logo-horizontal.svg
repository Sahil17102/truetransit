<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">TrueTransit Mobility Pvt Ltd</title>
  <desc id="desc">Horizontal TrueTransit logo with arrow T mark, company name, Mobility Pvt Ltd, and tagline.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06145f"/>
      <stop offset="1" stop-color="#0c4aa0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11b57f"/>
      <stop offset="1" stop-color="#007d64"/>
    </linearGradient>
  </defs>

  <g transform="translate(18 22) scale(0.62)">
    <path d="M72 62h318l61 42H55z" fill="#071261"/>
    <path d="M54 62h120l-24 42H30z" fill="#071261"/>
    <path d="M172 104h94l-61 213H91z" fill="url(#navy)"/>
    <path d="M388 64h184V26l76 78-76 76v-38H388z" fill="url(#green)"/>
    <path d="M340 136h98l-58 181h-98z" fill="url(#green)"/>
  </g>

  <text x="438" y="112"
