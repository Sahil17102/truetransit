  </text>

  <g transform="translate(438 158)">
    <line x1="0" y1="0" x2="66" y2="0" stroke="#007d64" stroke-width="4"/>
    <line x1="340" y1="0" x2="406" y2="0" stroke="#007d64" stroke-width="4"/>
    <text x="203" y="12" text-anchor="middle"
