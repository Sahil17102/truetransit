<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">TrueTransit Mobility Pvt Ltd</title>
  <desc id="desc">TrueTransit logo with arrow T mark, company name, Mobility Pvt Ltd, and tagline.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06145f"/>
