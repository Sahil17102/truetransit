services:
  - type: web
    name: truetransit-2
    runtime: static
    rootDir: client-panel
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://truetransit1.onrender.com/api
      - key: VITE_DEMO_OTP_ENABLED
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: truetransitadmin
    runtime: static
    rootDir: admin-panel
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: commit
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://truetransit1.onrender.com/api
      - key: REACT_APP_CLIENT_URL
        value: https://truetransit-2.onrender.com
      - key: REACT_APP_DEMO_ADMIN_ENABLED
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
