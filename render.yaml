services:
  - type: web
    name: truetransit-2
    runtime: static
    rootDir: client-panel
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://api.mydigivallet.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: truetransitadmin
    runtime: static
    rootDir: admin-panel
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: commit
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://api.mydigivallet.com/api
      - key: REACT_APP_CLIENT_URL
        value: https://truetransit-2.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
